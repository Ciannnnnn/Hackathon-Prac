<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Users</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app">

    <aside class="sidebar" id="sidebar">

        <div class="logo">

            <div class="logo-icon">
                M
            </div>

            <span>
                ManageSys
            </span>

        </div>

        <nav>

            <a href="dashboard.html" class="nav-link">

                <span>▦</span>

                Dashboard

            </a>

            <a href="users.html" class="nav-link active">

                <span>♙</span>

                Users

            </a>

        </nav>

        <div class="sidebar-bottom">

            <div class="profile">

                <div class="avatar">
                    A
                </div>

                <div>

                    <strong>
                        Admin
                    </strong>

                    <small>
                        Administrator
                    </small>

                </div>

            </div>

        </div>

    </aside>

    <main class="main">

        <header class="topbar">

            <button
                class="menu-button"
                id="menuButton"
            >
                ☰
            </button>

            <div>

                <h1>
                    Users
                </h1>

                <p>
                    Manage system users
                </p>

            </div>

        </header>

        <section class="content">

            <div class="panel">

                <div class="panel-header">

                    <div>

                        <h2>
                            User Management
                        </h2>

                        <p>
                            Add, edit, search and delete users
                        </p>

                    </div>

                    <button
                        class="primary-button"
                        id="addUserButton"
                    >
                        + Add User
                    </button>

                </div>

                <div class="toolbar">

                    <input
                        type="text"
                        id="searchInput"
                        class="search-input"
                        placeholder="Search users..."
                    >

                    <select id="statusFilter">

                        <option value="all">
                            All Status
                        </option>

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>

                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    ID
                                </th>

                                <th>
                                    Name
                                </th>

                                <th>
                                    Email
                                </th>

                                <th>
                                    Role
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Actions
                                </th>

                            </tr>

                        </thead>

                        <tbody id="usersTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

</div>

<div
    class="modal"
    id="userModal"
>

    <div class="modal-content">

        <div class="modal-header">

            <div>

                <h2 id="modalTitle">
                    Add User
                </h2>

                <p>
                    Enter the user's information
                </p>

            </div>

            <button
                class="close-button"
                id="closeModal"
            >
                ×
            </button>

        </div>

        <form id="userForm">

            <input
                type="hidden"
                id="userId"
            >

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Role
                </label>

                <select id="role">

                    <option value="User">
                        User
                    </option>

                    <option value="Administrator">
                        Administrator
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>
                    Status
                </label>

                <select id="status">

                    <option value="Active">
                        Active
                    </option>

                    <option value="Inactive">
                        Inactive
                    </option>

                </select>

            </div>

            <div class="form-actions">

                <button
                    type="button"
                    class="secondary-button"
                    id="cancelButton"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Save User
                </button>

            </div>

        </form>

    </div>

</div>

<div
    class="toast"
    id="toast"
>
</div>

<script src="js/api.js"></script>
<script src="js/users.js"></script>
<script src="js/script.js"></script>

</body>

</html>
